name: Android v1.0.16 native verification
on:
  push:
    branches: ['work/occupation-table']
    paths: ['.github/workflows/android-helper-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: PhiKinHua-FirstNight-APK
          run-id: 37695923691
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install PhiKinHua-FirstNight-v1.0.16.apk
            timeout 900 python -u scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-native-verification
          path: smoke-output/
          retention-days: 14
