name: Android v1.0.20 native verification
on:
  push:
    branches: ['art/quiet-comic-ui']
    paths: ['.github/workflows/android-helper-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install Pillow
      - name: Wait for the audited v20 APK
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0; attempt<60; attempt++) {
              const {data}=await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:37792936061});
              if(data.artifacts.some(a=>a.name==='PhiKinHua-FiveNights-APK'))return;
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:37792936061});
              if(run.status==='completed' && run.conclusion!=='success')throw new Error('APK build failed before producing an audited artifact');
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
            throw new Error('Audited APK was not produced within twenty minutes');
      - uses: actions/download-artifact@v4
        with:
          name: PhiKinHua-FiveNights-APK
          run-id: 37792936061
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install PhiKinHua-FiveNights-v1.0.20.apk
            timeout 900 python -u scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v20-native-verification
          path: smoke-output/
          retention-days: 14
