name: Android UI smoke only
on:
  push:
    branches: ['work/pulp-smoke']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: PhiKinHua-FirstNight-APK
          run-id: 37186812643
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install PhiKinHua-FirstNight-v1.0.2.apk
            timeout 900 python -u scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-smoke
          path: smoke-output/
          if-no-files-found: warn
