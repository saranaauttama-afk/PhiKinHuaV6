name: NOTFM rebuild APK
on:
  push:
    branches: ['work/notfm-phase6']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --maxWorkers=2 --testTimeout=60000 --silent
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: CI=1 npx expo prebuild --platform android
      - name: Build release APK (normal play, no QA win card)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 -Pandroid.enablePngCrunchInReleaseBuilds=false -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"
      - name: Verify signing, package and alignment
        run: |
          mkdir -p apk-audit
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" > apk-audit/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > apk-audit/zipalign.txt
          "$BT/aapt" dump badging "$APK" > apk-audit/package.txt
          grep "package: name='com.phikinhua.episode' versionCode='37' versionName='1.0.36'" apk-audit/package.txt
          cp "$APK" PhiKinHua-NOTFM-v1.0.36.apk
          sha256sum PhiKinHua-NOTFM-v1.0.36.apk > apk-audit/sha256.txt
          git rev-parse HEAD > apk-audit/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PhiKinHua-NOTFM-APK
          path: PhiKinHua-NOTFM-v1.0.36.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: NOTFM-APK-audit
          path: apk-audit/
