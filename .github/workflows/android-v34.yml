name: v34 Enemy Hand APK
on:
  push:
    branches: ['work/enemy-hand-v34']
    paths-ignore: ['**/*.md', 'docs/**/*.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --maxWorkers=2 --testTimeout=60000
      - run: V34_REPORT=docs/v34-ci-balance.json npx vite-node --config vitest.config.ts scripts/v34-balance.ts
      - run: npx vite-node --config vitest.config.ts scripts/v34-enemy-audit.ts
      - run: CI=1 npx expo export --platform web --output-dir /tmp/v34-web
      - uses: actions/upload-artifact@v4
        with:
          name: v34-verification
          path: |
            docs/v34-ci-balance.json
            docs/v34-enemy-audit.json
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: CI=1 npx expo prebuild --platform android
      - name: Build installable test APK without the QA win card
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 -Pandroid.enablePngCrunchInReleaseBuilds=false -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"
      - name: Verify signing, package and alignment
        run: |
          mkdir -p apk-audit
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" > apk-audit/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > apk-audit/zipalign.txt
          "$BT/aapt" dump badging "$APK" > apk-audit/package.txt
          grep "package: name='com.phikinhua.episode' versionCode='35' versionName='1.0.34'" apk-audit/package.txt
          cp "$APK" PhiKinHua-EnemyHand-v1.0.34.apk
          sha256sum PhiKinHua-EnemyHand-v1.0.34.apk > apk-audit/sha256.txt
          git rev-parse HEAD > apk-audit/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PhiKinHua-v34-APK
          path: PhiKinHua-EnemyHand-v1.0.34.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: v34-APK-audit
          path: apk-audit/
  native:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PhiKinHua-v34-APK
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install PhiKinHua-EnemyHand-v1.0.34.apk
            python scripts/android-v34-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34-native-smoke
          path: v34-native-audit/
