name: Paper Diorama rollout verification and review APK
on:
  push:
    branches: ['work/paper-diorama-rollout']
permissions:
  contents: read
concurrency:
  group: paper-rollout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --maxWorkers=2 --testTimeout=60000
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: EXPO_PUBLIC_UI_REVIEW=1 EXPO_PUBLIC_TEST_WIN_CARD=1 EXPO_PUBLIC_PAPER_DIORAMA=1 npx expo export --platform web --output-dir /tmp/phikinhua-backlog-web
      - run: EXPO_PUBLIC_TEST_WIN_CARD=1 npx vite-node --config vitest.config.ts scripts/backlog-fixtures.ts
      - run: EXPO_PUBLIC_TEST_WIN_CARD=1 npx vite-node --config vitest.config.ts scripts/v33-fixtures.ts
      - run: node scripts/v33-mobile-check.cjs
      - run: node scripts/three-night-mobile-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paper-rollout-web-audit
          path: backlog-audit/
